# ROUND 1 / ARM 8 -- OPT-125M FINE-TUNE (F14 step 1).
#
# Same seeded vsplit data and F4 seed-mesh prefix as round1_arm8_125M.yaml.
# Differs only in init: NO model.overrides, so modeling.get_model loads
# facebook/opt-125m via from_pretrained (transformer weights) and
# re-initialises token / position embeddings for vocab 320 and
# max_seq_length 5248 -- same split as the VertexRegen paper on OPT-350M.
#
# Requires the HF checkpoint on disk (or network). This machine's cache had
# only config.json as of 2026-09-07; download once:
#   huggingface-cli download facebook/opt-125m
# or let from_pretrained fetch on first launch.
#
# Hyper-params (FT vs the scratch twin):
#   lr 1e-4          paper / hull causal scale; scratch uses 2e-4
#   warmup 5k        shorter than scratch 20k -- do not wash pretrained features
#   max_steps 1M     shared ceiling; early stop (patience 20 x 10k) decides
#   batch 2 x accum 32 = 64 sequences/step (same effective size as arm8_L)
#   gradient_checkpointing on -- full 125M + seq 5248 will OOM without it
#
# Launch (example, cuda:0):
#   cd experiments/baselines/vertexregen
#   export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libgomp.so.1
#   export PYTHONPATH=/home/yunjia/.deps_vertexregen:/mnt/netdisk1/yunjia/optShapeGen:.
#   CUDA_VISIBLE_DEVICES=0 RUN_TS=$(date +%Y%m%d_%H%M%S) \
#     nohup python -u train.py --config-name round1_arm8_125M_ft \
#     > /tmp/r1_arm8_125M_ft.log 2>&1 &
# Confirm the log prints ~125M params and does NOT take the from-scratch path.

all:
  output_dir: /mnt/netdisk1/yunjia/optShapeGen/experiments/bracket/checkpoints/r1_arm8_125M_ft
  sub_dir: ${oc.env:RUN_TS}

hydra:
  job:
    env_set:
      OMP_NUM_THREADS: 1
  run:
    dir: ${all.output_dir}/${all.sub_dir}/hydra

model:
  vocab_size: 320
  num_pos_tokens: 256
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  sep_token_id: 3
  nil_token_id: 4
  pos_token_offset: 5
  path: "facebook/opt-125m"
  max_seq_length: 5248
  attn_implementation: flash_attention_2
  # CRITICAL: no overrides -- empty/null keeps pretrained transformer weights.
  overrides: null
  from_scratch: false

data:
  path: /mnt/netdisk1/yunjia/optShapeGen/data/bracket10k/bracketv3_vsplit_hf
  use_seed_mesh: True
  num_pos_tokens: ${model.num_pos_tokens}
  overfit: False

train:
  early_stopping_patience: 20
  early_stopping_threshold: 0.0
  train_args:
    output_dir: ${all.output_dir}/${all.sub_dir}/checkpoints
    logging_dir: ${all.output_dir}/${all.sub_dir}/logs
    report_to: tensorboard
    eval_strategy: steps
    save_strategy: steps
    logging_strategy: steps
    logging_steps: 50
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 32
    learning_rate: 1.0e-4
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    max_grad_norm: 1.0
    max_steps: 1000000
    lr_scheduler_type: warmup_stable_decay
    lr_scheduler_kwargs:
      num_stable_steps: 800000
      num_decay_steps: 180000
      min_lr_ratio: 0.1
    warmup_steps: 5000
    save_steps: 10000
    eval_steps: 10000
    save_total_limit: 3
    load_best_model_at_end: True
    metric_for_best_model: eval_loss
    greater_is_better: False
    dataloader_num_workers: 8
    dataloader_prefetch_factor: 2
    dataloader_persistent_workers: True
    ddp_find_unused_parameters: False
    gradient_checkpointing: True
    gradient_checkpointing_kwargs:
      use_reentrant: False
